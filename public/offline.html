<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AbundanceCoach - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 24px;
      opacity: 0.9;
    }

    .features {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      margin-top: 24px;
      text-align: left;
    }

    .features h2 {
      font-size: 18px;
      margin-bottom: 12px;
      text-align: center;
    }

    .features ul {
      list-style: none;
    }

    .features li {
      padding: 8px 0;
      padding-left: 24px;
      position: relative;
    }

    .features li:before {
      content: "✓";
      position: absolute;
      left: 0;
      font-weight: bold;
      color: #4ade80;
    }

    .retry-btn {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 32px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 20px;
      transition: all 0.3s ease;
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
    }

    .retry-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Estás Offline</h1>
    <p>Não conseguimos conectar à internet neste momento. Mas não te preocupes - algumas funcionalidades continuam disponíveis!</p>

    <div class="features">
      <h2>Disponível Offline:</h2>
      <ul>
        <li>Ver transações guardadas</li>
        <li>Consultar orçamentos</li>
        <li>Visualizar dashboards</li>
        <li>Aceder a relatórios salvos</li>
      </ul>
    </div>

    <button class="retry-btn" onclick="window.location.reload()">
      🔄 Tentar Novamente
    </button>

    <div class="status" id="status">
      A verificar ligação...
    </div>
  </div>

  <script>
    // Check connection status
    function updateOnlineStatus() {
      const statusEl = document.getElementById('status');
      if (navigator.onLine) {
        statusEl.textContent = '✓ Ligação restaurada! A recarregar...';
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } else {
        statusEl.textContent = '✗ Sem ligação à internet';
      }
    }

    // Listen for connection changes
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // Initial check
    updateOnlineStatus();

    // Periodic check every 5 seconds
    setInterval(updateOnlineStatus, 5000);
  </script>
</body>
</html>
