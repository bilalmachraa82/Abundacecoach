<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="96" height="96" rx="21" fill="url(#transGrad)"/>

  <!-- Receipt/Document icon -->
  <rect x="28" y="20" width="40" height="56" rx="4" fill="white" opacity="0.9"/>

  <!-- Lines representing transaction details -->
  <line x1="34" y1="30" x2="62" y2="30" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="38" x2="56" y2="38" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="46" x2="58" y2="46" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Euro symbol -->
  <text x="48" y="66" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#10b981" text-anchor="middle">€</text>

  <!-- Plus sign for "add" -->
  <circle cx="72" cy="72" r="12" fill="#fbbf24"/>
  <path d="M72 66 L72 78 M66 72 L78 72" stroke="white" stroke-width="3" stroke-linecap="round"/>
</svg>
