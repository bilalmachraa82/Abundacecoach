<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="96" height="96" rx="21" fill="url(#dashGrad)"/>

  <!-- Grid layout representing dashboard -->
  <rect x="16" y="16" width="28" height="28" rx="4" fill="white" opacity="0.9"/>
  <rect x="52" y="16" width="28" height="28" rx="4" fill="white" opacity="0.9"/>
  <rect x="16" y="52" width="28" height="28" rx="4" fill="white" opacity="0.9"/>
  <rect x="52" y="52" width="28" height="28" rx="4" fill="white" opacity="0.9"/>

  <!-- Chart elements inside cards -->
  <!-- Top left - bar chart -->
  <rect x="20" y="32" width="4" height="8" fill="#6366f1"/>
  <rect x="26" y="28" width="4" height="12" fill="#6366f1"/>
  <rect x="32" y="24" width="4" height="16" fill="#6366f1"/>

  <!-- Top right - pie chart segment -->
  <circle cx="66" cy="30" r="8" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="25 25"/>

  <!-- Bottom left - line trend -->
  <path d="M20 72 L26 66 L32 68 L38 62" stroke="#6366f1" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Bottom right - percentage -->
  <text x="66" y="70" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#6366f1" text-anchor="middle">%</text>
</svg>
